<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bryves TV</title>
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}
    header{height:64px;background:#101010;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#fff,#c9a227);color:#111;display:grid;place-items:center}
    #badge{display:none;background:#d40000;padding:7px 10px;border-radius:6px;font-size:12px;font-weight:bold}
    main{max-width:1100px;margin:auto;padding:20px 14px 50px}.player{background:#000;border-radius:14px;overflow:hidden}
    mux-player{display:block;width:100%;aspect-ratio:16/9}.offline{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#111;gap:10px;text-align:center}
    .info{margin-top:16px;background:#111;border:1px solid #242424;border-radius:12px;padding:18px}
    #title{font-size:23px;font-weight:800}#description{color:#999;margin-top:8px;line-height:1.5}#status{margin-top:12px;color:#888;font-size:13px}
    footer{text-align:center;color:#666;border-top:1px solid #202020;padding:25px;font-size:12px}
  </style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">B</div><span id="brand">Bryves TV</span></div>
  <div id="badge">● LIVE</div>
</header>
<main>
  <div class="player">
    <mux-player id="player" stream-type="live" controls style="display:none"></mux-player>
    <div id="offline" class="offline">
      <div style="font-size:44px">📺</div><h2 style="margin:0">Bryves TV is Offline</h2>
      <p style="color:#888">Please check again when the broadcast starts.</p>
    </div>
  </div>
  <div class="info">
    <div id="title">Bryves TV</div>
    <div id="description">Welcome to Bryves TV.</div>
    <div id="status">Checking live status...</div>
  </div>
</main>
<footer>© <span id="year"></span> Bryves TV</footer>
<script>
  const player=document.getElementById("player"),offline=document.getElementById("offline"),
        badge=document.getElementById("badge"),title=document.getElementById("title"),
        brand=document.getElementById("brand"),description=document.getElementById("description"),
        status=document.getElementById("status");
  document.getElementById("year").textContent=new Date().getFullYear();

  async function load(){
    try{
      const r=await fetch("/api/public/status?t="+Date.now());
      const d=await r.json();
      if(!d.success) throw new Error(d.error||"Failed");
      title.textContent=brand.textContent=d.title||"Bryves TV";
      description.textContent=d.description||"Welcome to Bryves TV.";
      if(d.live && d.playbackId){
        offline.style.display="none";player.style.display="block";badge.style.display="block";
        status.textContent="● LIVE";status.style.color="#29d477";
        if(player.getAttribute("playback-id")!==d.playbackId) player.setAttribute("playback-id",d.playbackId);
      }else{
        player.style.display="none";offline.style.display="flex";badge.style.display="none";
        status.textContent="OFFLINE";status.style.color="#888";
      }
    }catch(e){status.textContent="Unable to check live status."}
  }
  load();setInterval(load,5000);
</script>
</body>
</html>
